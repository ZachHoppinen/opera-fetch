name: opera-fetch
channels:
  - conda-forge
dependencies:
  # 3.14 writes netCDF correctly but ends in sys.excepthook noise at interpreter
  # shutdown, from rasterio/dask/h5py rather than from this package.
  - python=3.12

  # Everything the package needs to run. rioxarray brings rasterio and GDAL;
  # h5netcdf brings h5py. netCDF4 is deliberately absent: every read and write
  # names engine="h5netcdf" or "zarr", so the netCDF C library is never touched.
  - asf_search
  - dask
  - h5netcdf
  - h5py
  - numpy
  - pandas
  - pyproj
  - requests
  - rioxarray
  - shapely
  - tqdm
  - xarray
  - zarr

  - pip
  - pip:
      # setuptools-scm reads the version from git, so a checkout needs its history.
      # Add [develop] for the tests, and [vector] or [plot] for those features.
      - -e .
