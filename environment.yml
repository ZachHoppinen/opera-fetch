name: opera-fetch
channels:
  - conda-forge
dependencies:
  # 3.14 writes netCDF correctly but ends in sys.excepthook noise at interpreter
  # shutdown, from rasterio/dask/h5py rather than from this package.
  - python=3.12
  - asf_search
  - dask
  - geopandas
  - h5netcdf
  - h5py
  - matplotlib
  - netcdf4
  - numpy
  - pandas
  - pyproj
  - rasterio
  - rioxarray
  - requests
  - shapely
  - tqdm
  - xarray
  - zarr
  # Development and CI: the workflows invoke all four.
  - pytest
  - ruff>=0.14
  - python-build
  - twine
  - pip
  - pip:
      # Editable, and setuptools-scm reads the version from git, so a checkout
      # needs its full history for this to resolve.
      - -e .
