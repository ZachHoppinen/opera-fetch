name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags, so setuptools-scm can derive the version.
          fetch-depth: 0

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          # Cached on the environment.yml hash, so later runs skip the solve.
          cache-environment: true

      - name: Install the development extras
        # environment.yml is the lean runtime env, so the test and build tools come
        # from the [develop] extra rather than being carried by every user.
        run: pip install -e ".[develop]"

      - name: Lint
        run: ruff check src/ tests/ scripts/

      - name: Tests
        # Neither ASF nor granules on disk: this has to pass without a network.
        run: pytest -v -m "not network and not data"

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*
