[build-system]
requires = ["setuptools>=77", "setuptools_scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "opera-fetch"
dynamic = ["version"]
description = "OPERA Sentinel-1 RTC and CSLC for an area and a date range, on OPERA's own grid"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{name = "Zach Hoppinen", email = "zachhoppinen@gmail.com"}]
keywords = ["OPERA", "Sentinel-1", "SAR", "RTC", "CSLC", "InSAR", "ASF", "remote sensing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "asf_search",
    "dask",
    "h5netcdf",
    "h5py",
    "numpy",
    "pandas",
    "pyproj",
    "rasterio",
    "requests",
    "rioxarray",
    "shapely",
    "tqdm",
    "xarray",
    "zarr",
]

[project.urls]
Homepage = "https://github.com/ZachHoppinen/opera-fetch"
Repository = "https://github.com/ZachHoppinen/opera-fetch"
Issues = "https://github.com/ZachHoppinen/opera-fetch/issues"

[project.optional-dependencies]
# Reading an AOI from a shapefile or GeoJSON. A GeoDataFrame you already hold works
# without it; only opening a file needs geopandas.
vector = ["geopandas"]
# quicklook, and nothing else.
plot = ["matplotlib"]
develop = ["opera-fetch[vector,plot]", "pytest", "ruff", "build", "twine"]

[tool.setuptools_scm]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# So `pytest` alone works from a clean checkout: src for the package when it is not
# installed, and the root so the shared test helpers import as tests.conftest.
pythonpath = ["src", "."]
markers = [
    "network: hits ASF for real. Deselect with -m 'not network'.",
    "data: needs OPERA granules on this machine, and skips itself when they are absent.",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# Named rather than left to the default set, which grows between ruff releases and
# would otherwise fail CI on a rule that did not exist when the code was written.
select = ["E", "F", "I", "W", "UP", "B", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The examples read top to bottom; a long line in one is not worth wrapping.
"scripts/*" = ["E501"]
